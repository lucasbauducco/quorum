{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Quórum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{% static 'quorum/styles.css' %}">
</head>
<body>
<main class="ingreso">
  <form method="post" class="card">
    {% csrf_token %}
    <div class="marca"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5l8 7 8-7v14"/></svg></span><div><b>Quórum</b><small>Comité de cartera</small></div></div>
    <p class="muted">Ingresá para guardar tus carteras en el servidor y usarlas desde cualquier navegador.</p>
    {% if form.errors %}<p class="status neg">Usuario o contraseña incorrectos.</p>{% endif %}
    <label class="field">Usuario <input name="username" autocomplete="username" required autofocus></label>
    <label class="field">Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next|default:'/quorum/' }}">
    <button type="submit" class="btn">Ingresar</button>
    <a class="muted" href="{% url 'quorum' %}">Seguir sin ingresar (los datos quedan en este navegador)</a>
  </form>
</main>
</body>
</html>
